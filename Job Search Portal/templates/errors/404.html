{% extends 'base.html' %}

{% block title %}Page Not Found (404) | Job Search Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm p-5 my-5">
        <div class="text-primary display-1 fw-bold mb-3">
          404
        </div>
        <h3 class="fw-bold mb-2">Oops! Page Not Found</h3>
        <p class="text-muted mb-4">
          The page or job opening you are looking for might have been removed, closed, or is temporarily unavailable.
        </p>

        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'core:home' %}" class="btn btn-primary fw-semibold px-4">
            <i class="bi bi-house-door me-1"></i> Back to Home
          </a>
          <a href="{% url 'jobs:job_list' %}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-search me-1"></i> Browse Jobs
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
