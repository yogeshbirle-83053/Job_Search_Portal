{% extends 'base.html' %}

{% block title %}Access Denied (403) | Job Search Portal{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm p-5 my-5">
        <div class="text-danger display-1 fw-bold mb-3">
          <i class="bi bi-shield-x"></i>
        </div>
        <h3 class="fw-bold mb-2">403 - Access Forbidden</h3>
        <p class="text-muted mb-4">
          You do not have the required role or permissions to access this protected area.
        </p>

        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'dashboard:index' %}" class="btn btn-primary fw-semibold px-4">
            <i class="bi bi-speedometer2 me-1"></i> Go to My Dashboard
          </a>
          <a href="{% url 'core:home' %}" class="btn btn-outline-secondary px-4">
            Return to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
